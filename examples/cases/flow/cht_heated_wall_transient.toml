# The heated wall of `cht_heated_wall` with the heater switched on at
# t = 0: transient conjugate heat transfer (stage 7d6, D157, check V7.37
# of the stage 7 specification).
#
#   cargo run --release -p foehncraft-cli -- flow examples/cases/flow/cht_heated_wall_transient.toml
#
# The channel, the fluid and the 1000 W/m² under the wall as in the steady
# case; the wall is lighter (ρ = 100 kg/m³ instead of 2000, the
# conductivity the same), so that it warms up in a few minutes: its heat
# capacity of ρ c_p t = 16 kJ/(m² K) against a heat transfer to the flow
# of about 54 W/(m² K) gives a time constant of about 300 s. The steady
# temperatures do not depend on ρ c_p: after ten time constants (3000 s)
# the run is at the steady result of `cht_heated_wall` (mean temperature of
# the heated face 318.53 K). The flow starts from rest and is developed
# after a few steps (L/U = 4 s).
#
# Every step the run writes the heat balance (heat.csv): the 4000 W/m of
# the heater go into storage in the wall, storage in the fluid and the
# enthalpy the flow carries out; the imbalance stays at the solver
# tolerance in every step. The probes give the temperature of the heated
# face, of the interface and of the middle of the channel at x = 3 m.

case_format = "0.6"

[mesh.generate]
type = "hex"
dimension = 2
upper = [4.0, 1.2, 0.04]
cells = [80, 30, 1]
split = [
  { boundary = "xmin", axis = "y", at = 0.2, name = "inlet" },
  { boundary = "xmax", axis = "y", at = 0.2, name = "outlet" },
]
zones = [{ name = "wall", lower = [0.0, 0.0, 0.0], upper = [4.0, 0.2, 0.04] }]

[mesh]
renumber = "rcm"

[fluid]
density = 1.0
viscosity = 0.01                     # Re = 100
specific_heat = 1000.0
conductivity = 14.084507042253522    # Pr = μ c_p/k = 0.71

[materials.wall-solid]
kind = "solid"
description = "a made-up solid with k_s/k_f = 10 (not a database material)"
density = 100.0                      # light: a time constant of about 300 s
specific_heat = 800.0
conductivity = 140.84507042253522

[regions.wall]
kind = "solid"
zones = ["wall"]
material = "wall-solid"

[energy]
initial = 300.0                      # everything at the inlet temperature at t = 0

[initial]
velocity = [0.0, 0.0, 0.0]

[boundary.inlet]
type = "velocity-inlet"
velocity = [1.0, 0.0, 0.0]
[boundary.inlet.energy]
temperature = 300.0
[boundary.outlet]
type = "static-pressure-outlet"
pressure = 0.0
[boundary.ymax]
type = "wall"
[boundary.ymin]
type = "wall"
[boundary.ymin.energy]
heat_flux = 1000.0                   # W/m² into the wall
[boundary.xmin]
type = "wall"                        # the upstream end of the wall
[boundary.xmax]
type = "wall"                        # the downstream end of the wall
[boundary.zmin]
type = "symmetry"
[boundary.zmax]
type = "symmetry"

[time]
scheme = "bdf2"
time_step = 5.0
end_time = 3000.0

[solver]
outer_iterations = 3                 # the flow takes Courant numbers of 100

[solver.momentum]
relaxation = 0.9

[solver.energy]
relaxation = 1.0
tolerance = 1e-10
max_iter = 300

[output]
wall_csv = false
fields_every = 60                    # every 300 s
probes = [
  { name = "heated_face", point = [3.0, 0.02, 0.02] },
  { name = "interface", point = [3.0, 0.22, 0.02] },
  { name = "channel", point = [3.0, 0.7, 0.02] },
]
lines = [
  { name = "wall_top", from = [0.025, 0.18, 0.02], to = [3.975, 0.18, 0.02], points = 80 },
  { name = "across", from = [3.0, 0.0, 0.02], to = [3.0, 1.2, 0.02], points = 121 },
]
